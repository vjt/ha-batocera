name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Batocera 43's
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: python3 -m unittest discover -s tests/daemon -v

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -q pytest-homeassistant-custom-component asyncssh==2.24.0
      - run: python -m pytest -p no:cacheprovider

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --silent && npm test
        working-directory: tests/card
